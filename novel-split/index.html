<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Web小説分割ツール</title><link rel="stylesheet" href="/_astro/global.xOwS84PY.css"></head><body class="min-h-screen bg-gray-50 text-gray-900"><main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8"><!-- ヘッダー --><header class="mb-8"><h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Web小説分割ツール</h1><p class="mt-2 text-sm text-gray-600">青空文庫形式の小説ファイルを章・話単位に分割します。</p></header><!-- 操作パネル --><section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-gray-200"><div><label for="fileInput" class="mb-2 block text-sm font-semibold text-gray-700">小説ファイル</label><input type="file" id="fileInput" accept=".txt,text/plain" class="block w-full cursor-pointer rounded-lg border border-gray-300
                   bg-gray-50 text-sm text-gray-700
                   file:mr-4 file:border-0 file:bg-gray-800
                   file:px-4 file:py-2.5 file:text-sm file:font-semibold
                   file:text-white
                   hover:file:bg-gray-700
                   focus:outline-none"></div><!-- ボタン --><div class="mt-5 flex flex-wrap gap-3"><button id="splitBtn" type="button" class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold
                   text-white shadow-sm transition
                   hover:bg-blue-700
                   focus:outline-none focus:ring-2
                   focus:ring-blue-500 focus:ring-offset-2">分割</button><button id="zipBtn" type="button" disabled class="rounded-lg bg-gray-800 px-5 py-2.5 text-sm font-semibold
                   text-white shadow-sm transition
                   hover:bg-gray-900
                   focus:outline-none focus:ring-2
                   focus:ring-gray-500 focus:ring-offset-2
                   disabled:cursor-not-allowed
                   disabled:opacity-40">ZIPダウンロード</button></div><!-- ステータス --><div id="status" class="mt-4 min-h-6 text-sm text-gray-600" role="status" aria-live="polite"></div></section><!-- 結果 --><section id="result" class="mt-8 space-y-6"></section></main><script type="module" src="/_astro/novel-split.astro_astro_type_script_index_0_lang.oRuoumL2.js"></script></body></html>
